    // Extensión del prototipo Array (Corregido para ser más robusto)
    Array.prototype.findBy = function (column, value) {
        for (let i = 0; i < this.length; i++) {
            let object = this[i];
            // Convertimos ambos a Number para asegurar la comparación
            if (column in object && Number(object[column]) === Number(value)) {

            }
        }
        return null; // Si no encuentra nada
    };
