<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta Calificaciones</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div id="main-container" style="width: 100%; max-width: 800px; padding: 20px;">
        <form id="form">
            <div class="form">
                <h1>Consulta de Calificaciones</h1>
                <div class="grupo">
                    <input type="text" id="name" required><span class="barra"></span>
                    <label for="name">Matrícula</label>
                </div>
                <div class="grupo">
                    <input type="password" id="password" required><span class="barra"></span>
                    <label for="password">Contraseña (Misma que matrícula)</label>
                </div>
                
                <button type="submit">Consultar Resultado</button>
                <p class="warnings" id="warnings"></p>
            </div>
        </form>

        <div id="resultado-container" style="display: none; background: #fff; padding: 40px; box-shadow: 0 0 6px 0 rgba(255, 255, 255, 0.8); border-radius: 10px;">
            <h2 style="text-align: center; margin-bottom: 20px; color: #4568DC;">Resultados</h2>
            <div style="overflow-x: auto;">
                <table id="tabla-resultados">
                    <!-- Contenido de la tabla generado por JS -->
                </table>
            </div>
            <p style="text-align: center; font-style: italic; color: #555; margin-top: 20px; font-weight: 500;">
                El promedio de seminarios equivale al 15% de la calificación final, el promedio de reportes equivale al 15% de la calificación fiinal y el promedio de examenes al 70% de la calificación final.
            </p>
            <button id="btn-volver" style="width: 200px; margin-top: 20px;">Volver a consultar</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
